# [state] 只能通过 ./logo state / direction / version / release 修改；其余配置（色板、配色模式、字体、导出）可手工维护
[project]
name = "夏"
slug = "xia"
client = "Myself"
created = "2026-10-29"

[state]
stage = "exploring"
selected_direction = ""
selected_version = ""
current_release = ""
updated = "2026-10-29"

[palette]
# 试色阶段：A 夏夜蓝、B 正午橙、C 荷叶青各用一色，选定方向后再确定主色
night_blue = "#1E3A5F"
summer_orange = "#E8590C"
lotus_teal = "#0F766E"
ink = "#1A1A1A"

[color_modes]
modes = ["color", "mono", "reversed"]
# 单色/反白版默认把所有颜色映射为同一种颜色；图形内部靠颜色区分的细节会因此消失（check 会提醒）。
# 需要保留时，把内部细节的颜色映射为留白：单色版用 #FFFFFF，反白版用 #000000。
[color_modes.mono]
night_blue = "#000000"
summer_orange = "#000000"
lotus_teal = "#000000"
ink = "#000000"
[color_modes.reversed]
night_blue = "#FFFFFF"
summer_orange = "#FFFFFF"
lotus_teal = "#FFFFFF"
ink = "#FFFFFF"

[fonts]
used = ["source-han-sans-sc-bold", "lxgw-wenkai-medium"]

[export]
# 按需生成的目标（./logo export <slug> 不点名时生成这些）：svg、favicon、ios、android、avatar
targets = ["svg", "avatar"]
# App 图标、头像与 Android 背景层的品牌底色（色板中的色名）；旧名 android_background 仍兼容
app_background = "night_blue"
# 自动排版的 App 图标、头像与 Android 前景层里图形的配色：reversed（白色图形，配品牌底色）/ mono / color
icon_mode = "reversed"

[series]
# 由 ./logo new --series / ./logo series add 写入，请勿手改
id = "xia"
role = "master"
